<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Clock - Sara Mendes</title>

   <link rel="stylesheet" href="src/styles.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.3/moment-timezone-with-data-1970-2030.min.js"></script>

  </head>
  
  <body>
    <div class="container">
    <h1>World Clock</h1>
      
    <select>
      <option value="">Select a city</option>
      <option value="London">London</option>
      <option value="New York">New York</option>
      <option value="Auckland">Auckland</option>
      </select>

      <div class="city" id="los-angeles">
        <h2>Los Angeles</h2>
      </div>
      <div class="date"></div>
      <div class="time"></div>

     <div class="city" id="paris">
        <h2>Paris</h2>
      </div>
      <div class="date"></div>
      <div class="time"></div>
      </div>
    
    <footer>This project was coded by <strong>Sara Mendes</strong> and is <a href="https://github.com/saramendes96/World-Clock-Project/tree/main" target="_blank"> open sourced on GitHub
    </footer>
      <script src="index.js"></script>
  </body>
</html>
