<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Clock - Sara Mendes</title>

   <link rel="stylesheet" href="src/styles.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.3/moment-timezone-with-data-1970-2030.min.js"></script>

  </head>
  
  <body>
    <div class="container">
    <h1>World Clock</h1>
      
    <select id="city" onchange="updateCity(event)">
      <option value="">Select a city</option>
      <option value="Europe/London">London</option>
      <option value="America/New_York">New York</option>
      <option value="Pacific/Auckland">Auckland</option>
      </select>

    <footer>This project was coded by <strong>Sara Mendes</strong> and is <a href="https://github.com/saramendes96/World-Clock-Project/tree/main" target="_blank"> open sourced on GitHub</a>
    </footer>
      <script src="src/index.js"></script>
  </body>
</html>
