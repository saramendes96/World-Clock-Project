<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Clock - Sara Mendes</title>
  </head>
  <body>
    <div class="container>
    <h1>World Clock</h1>
      
    <select>
      <option value="">Select a city</option>
      <option value="London">London</option>
      <option value="New York">New York</option>
      <option value="Auckland">Auckland</option>
      </select>

      <div class="city">
        <h2>Los Angeles</h2>
      </div>
      <div class="date">September 4th 2026</div>
      <div class="time">03:10:15 <small>PM</small></div>
      </div>

     <div class="city">
        <h2>Paris</h2>
      </div>
      <div class="date">September 4th 2026</div>
      <div class="time">03:10:15 <small>PM</small></div>
      </div>
    
    <footer>This project was coded by Sara Mendes and is <a href="https://github.com/saramendes96/World-Clock-Project/tree/main" target="_blank"> open sourced on GitHub
    </footer>
      <script src="index.js"></script>
  </body>
</html>
